name: fpga
on:
  push:
  workflow_dispatch:
jobs:
  fpga:
    runs-on: ubuntu-24.04
    env:
      # tt_fpga.py otherwise defaults nextpnr to 12 MHz; match the real external clock.
      TT_FPGA_FREQ: "25.2"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Board relay setup contract tests
        run: python -m unittest discover -s fpga -p 'test*.py' -v
      - name: FPGA bitstream for ETR ASIC simulator (ICE40UP5K FabricFox v2)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttsky26d
        with:
          tools-ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a

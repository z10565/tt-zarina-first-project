# Tiny Tapeout project information
# Template: https://github.com/TinyTapeout/ttsky-verilog-template
project:
  title: "Phone Flight"
  author: "Zarina and RTU Chipathon team"
  discord: "z10565"
  description: "Phone-controlled VGA flight game with UART controls and physical fire button"
  language: "Verilog"
  clock_hz: 25200000
  # Two tiles. Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2.
  tiles: "1x2"

  # Top module names must start with "tt_um_".
  top_module: "tt_um_zarina_phone_flight"
  # Source files are relative to ./src; list each file separately.
  # Keep PROJECT_SOURCES in test/Makefile in sync.
  source_files:
    - "project.v"
    - "uart_rx.v"
    - "control_packet.v"
    - "fire_button.v"
    - "vga_timing.v"
    - "flight_game.v"
    - "pixel_renderer.v"
# The pinout is used for the datasheet/website. Leave unused pins blank.
# Do not delete or add pins.
pinout:
  # Inputs
  ui[0]: "FIRE (active high)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: "UART RX (115200 8N1)"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
# Do not change!
yaml_version: 6
